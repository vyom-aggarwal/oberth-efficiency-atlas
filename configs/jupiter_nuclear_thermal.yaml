# Jupiter powered flyby at 1.5 R_J with a nuclear-thermal engine. Burn centered on periapsis.
# Engine given as thrust and mass, to exercise that path (a0 = 0.5 m/s²).
body: jupiter
flyby:
  v_inf_in_km_s: 6.0
  periapsis_altitude_km: 35746.0     # 0.5 × equatorial radius
engine:
  isp_s: 850.0          # representative NTR Isp (assumption)
  thrust_N: 100000.0
  m0_kg: 200000.0
burn:
  delta_v_km_s: 2.0
steering:
  law: prograde
safety_margin_km: 5000.0
