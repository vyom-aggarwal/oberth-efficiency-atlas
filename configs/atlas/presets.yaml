# Engine classes and mission envelopes for the Phase 2 atlas.
#
# ALL VALUES HERE ARE REPRESENTATIVE ASSUMPTIONS, not sourced hardware specifications. They span
# plausible ranges for each technology and destination, so the atlas can show where real missions
# sit. Edit them freely: the sweep grid bounds and the mission overlays are derived from this file.
# Rationale is recorded in RESEARCH_LOG.md (2026-10-04, presets entry).

engines:
  hydrolox:
    label: Hydrolox
    isp_s: [440.0, 465.0]          # brief: ~465 s
    a0_m_s2: [1.0, 15.0]           # upper stage carrying a payload
  methalox_vac:
    label: Methalox (vac)
    isp_s: [360.0, 380.0]          # brief: ~380 s
    a0_m_s2: [2.0, 30.0]
  nuclear_thermal:
    label: Nuclear thermal
    isp_s: [800.0, 900.0]          # brief: ~850 s
    a0_m_s2: [0.1, 3.0]            # heavy reactor and shielding: low thrust-to-weight
  hall:
    label: Hall thruster
    isp_s: [1500.0, 2000.0]        # brief: 1500-2000 s
    a0_m_s2: [5.0e-5, 1.0e-3]      # ~0.1-2 N on ~0.5-3 t spacecraft
  gridded_ion:
    label: Gridded ion
    isp_s: [3000.0, 4000.0]        # brief: 3000-4000 s
    a0_m_s2: [1.0e-5, 5.0e-4]      # ~0.02-0.5 N on ~0.5-3 t spacecraft

# Flyby envelopes per body. Periapsis is given as r_p/R_eq (Sun, giant planets) or as altitude
# (terrestrial planets).
bodies:
  sun:
    r_p_over_R: [3.0, 20.0]        # solar Oberth concepts at a few solar radii (Parker: ~9.9 R_sun)
    v_inf_km_s: [2.0, 20.0]        # hyperbolic arrivals only (see Q2 on bound solar dives)
  venus:
    altitude_km: [200.0, 5000.0]
    v_inf_km_s: [2.0, 10.0]
  earth:
    altitude_km: [200.0, 5000.0]
    v_inf_km_s: [1.0, 10.0]
  mars:
    altitude_km: [200.0, 3000.0]
    v_inf_km_s: [1.0, 8.0]
  jupiter:
    r_p_over_R: [1.05, 10.0]       # radiation belts make the lowest passes costly
    v_inf_km_s: [4.0, 12.0]
  saturn:
    r_p_over_R: [1.2, 10.0]        # low passes need an inclined geometry to clear the rings
    v_inf_km_s: [4.0, 10.0]

delta_v_km_s: [0.2, 3.0]           # Δv spent during the flyby, all engine classes
